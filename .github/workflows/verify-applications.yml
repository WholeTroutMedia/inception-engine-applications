name: Verify WholeTroutMedia Micro-Applications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-micro-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute all verify_app.py suites
        run: |
          for script in apps/*/verify_app.py; do
            echo "=== Running $script ==="
            python3 "$script"
          done
