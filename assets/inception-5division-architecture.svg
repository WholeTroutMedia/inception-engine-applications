      <text x="16" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="700">Epistemic &amp; Strategy</text>
      <text x="16" y="78" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">• Specification Purity</text>
      <text x="16" y="100" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">• Competing-PR Triage</text>
      <text x="16" y="122" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">• Maintainer Alignment</text>
      <text x="16" y="144" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">• Research Synthesis</text>
