    <text x="1120" y="0" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">BOARD &amp; PRINCIPAL SIGN-OFF GATE</text>
  </g>

  <line x1="40" y1="52" x2="1160" y2="52" stroke="#1E293B" stroke-width="1"/>

