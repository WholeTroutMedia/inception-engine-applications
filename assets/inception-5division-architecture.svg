<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%" role="img" aria-label="Inception Engine 5-Division Engineering and Governance Architecture">
  <defs>
    <!-- Tactile hairline & Fibonacci cadence: 8px, 13px, 21px, 34px, 55px -->
    <style>
      .arch-serif { font-family: 'Instrument Serif', Georgia, serif; font-size: 21px; }
      .arch-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; padding: 13px; gap: 21px; }
      .arch-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    </style>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D12"/>
      <stop offset="100%" stop-color="#0E141D"/>
    </linearGradient>
    <pattern id="archHairline" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="290" rx="13" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.5"/>
