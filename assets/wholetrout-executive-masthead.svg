    <text x="394" y="0" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.4">Inception Engine Systems</text>

